name: Flutter CI

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push formatting fixes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git push

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # AUTO-FORMAT: Fixes your formatting issues and commits them
      - name: Format Dart code (auto-fix & commit)
        run: |
          dart format .
          if ! git diff --quiet; then
            echo "Formatting changes detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply dart format [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "No formatting changes needed."
          fi

      # Optional: Keep linting and testing
      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Uncomment if you build web
      # - name: Build web
      #   run: flutter build web
