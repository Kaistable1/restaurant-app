name: CI Pipeline

# ----------------------------------------------------------------------
# Triggers
# ----------------------------------------------------------------------
on:
  push:
    branches: [ main, develop, staging, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

# ----------------------------------------------------------------------
# Jobs
# ----------------------------------------------------------------------
jobs:
  # --------------------------------------------------------------
  # 1. Build Flutter Web + run Dart/Flutter checks
  # --------------------------------------------------------------
  build-flutter-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run unit tests (headless Chrome)
        run: flutter test --platform=chrome
        continue-on-error: true  # Allow build to continue on test failures

      - name: Build web app (release, canvaskit)
        run: flutter build web --release --web-renderer=canvaskit

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  # --------------------------------------------------------------
  # 2. (Optional) Node lint + unit tests
  # --------------------------------------------------------------
  node-checks:
    name: Node Lint & Tests
    runs-on: ubuntu-latest
    needs: build-flutter-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Lint
        run: npm run lint || true  # Non-blocking

      - name: Run unit tests
        run: npm test

  # --------------------------------------------------------------
  # 3. Cypress smoke tests (runs after Flutter build)
  # --------------------------------------------------------------
  cypress-smoke:
    name: Cypress Smoke Tests
    needs: [build-flutter-web, node-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps + Cypress binary
        run: |
          npm ci
          npx cypress install

      - name: Download Flutter web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web/

      - name: Serve Flutter app
        run: |
          npm install -g dhttpd
          dhttpd --path=build/web --port=8080 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 8

      - name: Wait for server to be ready
        run: |
          timeout 30 bash -c 'until curl -s -f http://localhost:8080 > /dev/null; do sleep 2; done' || \
            echo "Warning: Server not ready in time"

      - name: Run Cypress smoke tests
        env:
          CYPRESS_baseUrl: http://localhost:8080
        run: |
          npx cypress run \
            --spec "cypress/e2e/smoke_spec.cy.js" \
            --browser chrome

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7

      - name: Upload videos (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 7

      # --------------------------------------------------------------
      # Cleanup server – safe and works in all shells
      # --------------------------------------------------------------
      - name: Cleanup server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "${SERVER_PID}" || true
          fi