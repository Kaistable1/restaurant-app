name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint || true

      - name: Run unit tests
        run: |
          npm test

  cypress-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Start app (staging or local)
        run: |
          # Replace with your start command for staging or a dev server
          npm run start & sleep 5

      - name: Cypress run (smoke)
        uses: cypress-io/github-action@v5
        with:
          start: false
          config-file: cypress.json
