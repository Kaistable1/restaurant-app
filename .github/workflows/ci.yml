name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run dart format (in-place)
        run: dart format .

      - name: Commit and push formatting changes (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          # Only attempt to push if we have a writable token. For PRs from forks this will likely fail.
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: format code (automated) [skip ci]" || echo "nothing to commit"
            echo "Attempting to push formatting commit to branch: $BRANCH_NAME"
            git push origin HEAD:$BRANCH_NAME || echo "Push failed (likely a fork or permission issue). Continue without failing."
          else
            echo "No formatting changes"
          fi

      - name: Verify formatting (fail if any remaining diffs)
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: flutter test --no-sound-null-safety
