name: Flutter CI

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # AUTO-FORMAT + COMMIT (this is the magic that saved you today)
      - name: Auto-format Dart code
        id: format
        run: |
          echo "Running dart format..."
          dart format .
          if git diff --quiet; then
            echo "No changes needed."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: auto-format Dart code [skip ci]" || echo "Nothing to commit"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Only fail formatting if we didn't just auto-fix it
      - name: Verify formatting
        if: steps.format.outputs.changed == 'false'
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release --web-renderer=canvaskit

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7