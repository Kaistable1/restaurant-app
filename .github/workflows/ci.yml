name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: flutter format --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Run unit tests
        run: flutter test
        continue-on-error: true

      - name: Build web app
        run: flutter build web --release
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  cypress-smoke:
    name: Cypress Smoke Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Cypress
        run: |
          npm install --save-dev cypress@13
          npx cypress install

      - name: Setup Flutter for serving
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web/

      - name: Serve Flutter app
        run: |
          flutter pub get
          flutter pub global activate dhttpd
          flutter pub global run dhttpd --path=build/web --port=8080 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 5
        continue-on-error: true

      - name: Wait for server
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8080; do sleep 2; done' || echo "Server might not be ready"
        continue-on-error: true

      - name: Run Cypress smoke tests
        run: npx cypress run --spec "cypress/integration/smoke_spec.cy.js" --browser chrome
        env:
          CYPRESS_baseUrl: http://localhost:8080
        continue-on-error: true

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
