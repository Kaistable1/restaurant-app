name: Flutter CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@main
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Inject Firebase config (from secrets)
        if: env.GOOGLE_SERVICES_JSON != '' || env.IOS_GOOGLE_SERVICE_INFO_PLIST != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "android/app/google-services.json created"
          fi
          if [ -n "$IOS_GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST" > ios/GoogleService-Info.plist
            echo "ios/GoogleService-Info.plist created"
          fi

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --no-test-assets

      - name: Build debug APK (smoke test)
        run: flutter build apk --debug --no-shrink
