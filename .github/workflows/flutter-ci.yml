name: Flutter CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Inject google-services (from secrets if provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          if [ -n "$IOS_GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$IOS_GOOGLE_SERVICE_INFO_PLIST" > ios/GoogleService-Info.plist
          fi

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-test-assets

      - name: Build APK (smoke)
        run: flutter build apk --no-shrink
